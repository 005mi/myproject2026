<!-- ── PDF PREVIEW MODAL ── -->
<div id="pdfModal" class="pdf-modal-overlay">
    <div class="pdf-modal-container">
        <div class="pdf-modal-header">
            <div class="pdf-modal-title">
                <i class="fas fa-file-pdf" style="color: #ef4444; font-size: 1.4rem;"></i>
                <span id="modalTitle">ตัวอย่างงานวิจัย</span>
            </div>
            <button class="pdf-modal-close" onclick="closePdfPreview()" title="ปิด">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="pdf-modal-body">
            <iframe id="pdfFrame" src="" frameborder="0"></iframe>
        </div>
        <div class="pdf-modal-footer">
            RETC Academic Portal วิทยาลัยเทคนิคร้อยเอ็ด
        </div>
    </div>
</div>

<style>
    /* ── PDF MODAL CSS (GLOBAL) ── */
    .pdf-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5); z-index: 9999;
        display: none; align-items: center; justify-content: center;
        backdrop-filter: blur(8px); padding: 20px;
    }
    .pdf-modal-container {
        width: 100%; max-width: 1200px; height: 90vh;
        background: white; border-radius: 24px;
        display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3);
        animation: modalFadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pdf-modal-header {
        padding: 20px 24px; background: white;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid #f1f5f9;
    }
    .pdf-modal-title {
        color: #0f172a; font-family: 'Sarabun', sans-serif;
        font-weight: 800; font-size: 1.1rem;
        display: flex; align-items: center; gap: 12px;
    }
    .pdf-modal-close {
        width: 40px; height: 40px; border-radius: 50%;
        background: #f1f5f9; color: #64748b;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.2s; border: none;
    }
    .pdf-modal-close:hover { background: #ef4444; color: white; transform: rotate(90deg); }
    .pdf-modal-body { flex: 1; background: #525659; position: relative; }
    .pdf-modal-body iframe { width: 100%; height: 100%; border: none; }
    .pdf-modal-footer {
        padding: 12px 24px; background: white; color: #94a3b8;
        font-family: 'Sarabun', sans-serif; font-size: 0.8rem;
        text-align: center; border-top: 1px solid #f1f5f9;
    }
    @keyframes modalFadeUp {
        from { opacity: 0; transform: scale(0.95) translateY(30px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
</style>

<script>
    function openPdfPreview(url, title) {
        document.getElementById('modalTitle').textContent = title;
        // ✅ เพิ่ม #toolbar=0 เพื่อซ่อนเครื่องมือของ Browser
        document.getElementById('pdfFrame').src = url + '#toolbar=0&navpanes=0&scrollbar=0';
        const modal = document.getElementById('pdfModal');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function closePdfPreview() {
        document.getElementById('pdfModal').style.display = 'none';
        document.getElementById('pdfFrame').src = '';
        document.body.style.overflow = '';
    }
    document.getElementById('pdfModal').addEventListener('click', function (e) {
        if (e.target === this) closePdfPreview();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closePdfPreview();
    });
</script>
